<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>To-Do App</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>
    <header id="head">
        <div class="top-heading">
            <h2>To-Do Application</h2>
            <hr>
            <h5>Productivity Matters!!</h5>
        </div>
        <div id="Add-ToDo" onclick="addBtn()">
            <div>
                +
            </div>
            <div>
                <h3>Add a New Task</h3>
            </div>
        </div>
        <dialog id="add-task">
            <h2>Add ToDo</h2>
            <div id="task-title">
                <input type="text" size="40" placeholder="Enter The Title" id="actual-title" required >
                <br />
                <label for="priority-menu">Priority
                    <select name="priority" id="priority-menu">
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                        <option value="low">Low</option>
                    </select>
                </label>
            </div>
            <div id="add-task-buttons">
                <button id="close-add-dialog">Cancel</button>
                <button onclick="add()">Add</button>
            </div>
        </dialog>

        <dialog id="viewDialog">
            <div class="dialog-content">
                <h4>ToDo Title</h4>
                <h2 id="todo-title">Dialog Title</h2>
                <!-- Action / Close Buttons -->
                <div class="dialog-actions">
                    <button id="closeModalBtn" class="btn-close">Close</button>
                    <button id="editBtn" class="btn-edit">Edit</button>
                </div>
            </div>
        </dialog>

        <dialog id="update-dialog">
            <h2>Update ToDo</h2>
            <div class="dialog-actions">
                <button id="delete-todo"><img src="./images/icons8-delete-24.png" alt="delete"></button>
            </div>
            <div id="task-title">
                <input type="text" placeholder="Enter your new Title" id="updatedTodoInput" size="45" required >
                <label for="priority-menu">Priority
                    <select name="priority" id="priority-menu">
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                        <option value="low">Low</option>
                    </select>
                </label>
            </div>
            <div class="dialog-actions">
                <button id="close-update">Close</button>
                <button id="update-todo">Update ToDo</button>
            </div>
        </dialog>

    </header>
    <section class="List-Panel">
        <div class="container">
            <div class="counter">
                <h3>Tasks <span id="tasks-count">0</span>/<span id="Total-tasks">0</span></h3>
            </div>
            <ul id="todolistelement"></ul>
            <!-- <div id="todo-1" class="ToDo-row">
                <span>1</span>  <div><input type="checkbox"></div> <div><h4>Go to the gym and exercise</h4></div>
            </div>
             <div id="todo-1" class="ToDo-row">
                <span>1</span>  <div><input type="checkbox"></div> <div><h4>Go to the gym and exercise</h4></div>
            </div>
            <div id="todo-1" class="ToDo-row">
                <span>1</span>  <div><input type="checkbox"></div> <div><h4>Go to the gym and exercise</h4></div>
            </div>
            <div id="todo-1" class="ToDo-row">
                <span>1</span>  <div><input type="checkbox"></div> <div><h4>Go to the gym and exercise</h4></div>
            </div> -->
        </div>
    </section>
</body>

</html>
