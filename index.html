<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="head">
        <div class="top-heading">
            <h2>To-Do Application</h2>
            <hr>
            <h5>Productivity Matters!!</h5>
        </div>
        <div id="Add-ToDo">
            <div>
                +
            </div>
            <div>
                <h3>Add a New Task</h3>
            </div>
        </div>
        <div id="add-task">
            <div id="task-title">
                <input type="text" size="50" placeholder="Enter The Title">
            </div>
            <div id="task-desc">
                <textarea name="desc" id="desc" rows="5" cols="60" placeholder="Description..."></textarea>
            </div>
            <div id="add-task-buttons">
                <button>Add</button>
                <select name="priority" id="priority-menu">
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                    <option value="low">Low</option>
                </select>
                <button>Cancel</button>
            </div>
        </div>
    </header>
    <section class="List-Panel">
        <div class="container">
            <div class="counter"><h3>Tasks:<span id="tasks-count">0</span>/<span id="Total-tasks">0</span></h3></div>
            <div id="todo-1" class="ToDo-row">
                <span>1</span>  <div><input type="checkbox"></div> <div><h4>Go to the gym and exercise</h4></div>
            </div>
             <div id="todo-1" class="ToDo-row">
                <span>1</span>  <div><input type="checkbox"></div> <div><h4>Go to the gym and exercise</h4></div>
            </div>
            <div id="todo-1" class="ToDo-row">
                <span>1</span>  <div><input type="checkbox"></div> <div><h4>Go to the gym and exercise</h4></div>
            </div>
            <div id="todo-1" class="ToDo-row">
                <span>1</span>  <div><input type="checkbox"></div> <div><h4>Go to the gym and exercise</h4></div>
            </div>
        </div>
    </section>
</body>
</html>
