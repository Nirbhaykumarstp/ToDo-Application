<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <style>
        dialog {
            padding: 24px;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            max-width: 400px;
            width: 100%;
        }

        /* Style the semi-transparent background overlay */
        dialog::backdrop {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            /* Adds a modern blur effect */
        }

        /* Optional styling for interior buttons */
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        #openBtn {
            background-color: #007bff;
            color: white;
        }

        #closeBtn {
            background-color: #dc3545;
            color: white;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <!-- Button to open the dialog -->
    <button id="openBtn">Open Dialog</button>

    <!-- The Dialog Box Component -->
    <dialog id="myDialog">
        <h2>Dialog Title</h2>
        <p>This is a modern, accessible native HTML dialog box.</p>

        <!-- Button to close the dialog -->
        <button id="closeBtn">Close</button>
    </dialog>
</body>
<script>
    // Select DOM elements
    const dialog = document.getElementById('myDialog');
    const openBtn = document.getElementById('openBtn');
    const closeBtn = document.getElementById('closeBtn');

    // Open dialog when trigger button is clicked
    openBtn.addEventListener('click', () => {
        dialog.showModal(); // Automatically centers the box and handles background blocking
    });

    // Close dialog when close button is clicked
    closeBtn.addEventListener('click', () => {
        dialog.close();
    });

    // Optional: Close dialog if user clicks outside on the backdrop
    dialog.addEventListener('click', (event) => {
        const rect = dialog.getBoundingClientRect();
        const isInDialog = (
            rect.top <= event.clientY && event.clientY <= rect.top + rect.height &&
            rect.left <= event.clientX && event.clientX <= rect.left + rect.width
        );
        if (!isInDialog) {
            dialog.close();
        }
    });
</script>

</html>
